name: CI

on:
  push:
    branches: [master, stage-2-modernization]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Fails only on real errors (broken hooks usage, undefined
      # references) — see eslint.config.js for why the large pre-existing
      # unused-variable warning count is a warning, not a blocker, here.
      - run: npm run lint

      # Coverage thresholds live in vite.config.js and are set below the
      # store layer's real current coverage, not an aspirational number —
      # they catch regressions, not enforce a target nobody's hit yet.
      - run: npm run test:coverage

      - run: npm run build

      # High/critical only — see the equivalent note in school-backend's
      # workflow. Frontend is at 0 vulnerabilities as of the Stage 2.2
      # migration; this is a going-forward gate, not a current fix.
      - run: npm audit --audit-level=high

      # Proves a frontend-only contributor's first command actually works
      # from a clean clone, not just that it's documented.
      - run: ./setup-standalone.sh
